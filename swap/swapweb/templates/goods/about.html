{% extends 'base.html' %}

{% block title %}关于我们 - SWAP校园二手交易平台{% endblock %}



{% block content %}
<div class="about-container" style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
    <h1 style="text-align: center; margin-bottom: 40px; color: #1f2937;">关于 SWAP</h1>
    
    <div class="about-content" style="line-height: 1.8; color: #4b5563; font-size: 16px;">
        <p style="margin-bottom: 20px;">
            SWAP 是一个专注于校园内闲置物品交易的平台，旨在帮助同学们更方便地转让闲置物品，让资源流转起来，实现绿色环保的校园生活。
        </p>
        
        <p style="margin-bottom: 20px;">
            我们致力于打造一个简单、高效、安全的校园交易环境，让每一件闲置物品都能找到新的主人。
        </p>
        
        <div class="official-link" style="margin: 40px 0; padding: 20px; background-color: #f3f4f6; border-radius: 8px; text-align: center;">
            <p style="margin-bottom: 10px; font-weight: 600;">官方网站</p>
            <a href="https://www.pcquick.cn" target="_blank" style="color: #4A90E2; text-decoration: none;">
                www.pcquick.cn
            </a>
        </div>
        
        <div class="feedback" style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
            <p style="text-align: center; color: #9ca3af;">
                如果您在使用过程中遇到任何问题，欢迎前往官方网站联系我们反馈。
            </p>
        </div>
    </div>
</div>


{% endblock %}
